version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: samudra_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-samudra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-samudra}
      POSTGRES_DB: ${POSTGRES_DB:-samudra}
    ports:
      - "5432:5432"
    volumes:
      - samudra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-samudra}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: samudra_redis
    ports:
      - "6379:6379"
    volumes:
      - samudra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  samudra_pgdata:
  samudra_redis_data:
