version: "3.9"

services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: orca_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orca}
      POSTGRES_DB: ${POSTGRES_DB:-orca}
    ports:
      - "5432:5432"
    volumes:
      - orca_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: orca_redis
    ports:
      - "6379:6379"
    volumes:
      - orca_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orca_pgdata:
  orca_redis_data:
